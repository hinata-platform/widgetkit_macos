name: widgetkit_macos
description: "WidgetKit for Flutter on macOS: share data with a widget extension through an App Group and reload its timelines."
version: 0.1.1
homepage: https://github.com/hinata-platform/widgetkit_macos
repository: https://github.com/hinata-platform/widgetkit_macos
issue_tracker: https://github.com/hinata-platform/widgetkit_macos/issues
topics:
  - widget
  - widgetkit
  - macos
  - home-widget

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: WidgetkitMacosPlugin
